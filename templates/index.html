<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Disease Predictor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container py-4">
        <h1 class="text-center mb-4">Heart Disease Predictor</h1>
        
        <div class="card">
            <div class="card-body">
                <form id="predictionForm">
                    <div class="row g-3">
                        <!-- Age -->
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="age">Age</label>
                                <input type="number" class="form-control" id="age" name="age" required>
                            </div>
                        </div>

                        <!-- Sex -->
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="sex">Sex</label>
                                <select class="form-control" id="sex" name="sex" required>
                                    <option value="">Select</option>
                                    <option value="1">Male</option>
                                    <option value="0">Female</option>
                                </select>
                            </div>
                        </div>

                        <!-- Chest Pain Type -->
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="cp">Chest Pain Type</label>
                                <select class="form-control" id="cp" name="cp" required>
                                    <option value="">Select</option>
                                    <option value="1">Typical Angina</option>
                                    <option value="2">Atypical Angina</option>
                                    <option value="3">Non-anginal Pain</option>
                                    <option value="4">Asymptomatic</option>
                                </select>
                            </div>
                        </div>

                        <!-- Resting Blood Pressure -->
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="trestbps">Resting Blood Pressure (mm Hg)</label>
                                <input type="number" class="form-control" id="trestbps" name="trestbps" required>
                            </div>
                        </div>

                        <!-- Cholesterol -->
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="chol">Cholesterol (mg/dl)</label>
                                <input type="number" class="form-control" id="chol" name="chol" required>
                            </div>
                        </div>

                        <!-- Fasting Blood Sugar -->
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="fbs">Fasting Blood Sugar &gt; 120 mg/dl</label>
                                <select class="form-control" id="fbs" name="fbs" required>
                                    <option value="">Select</option>
                                    <option value="1">Yes</option>
                                    <option value="0">No</option>
                                </select>
                            </div>
                        </div>

                        <!-- Resting ECG -->
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="restecg">Resting ECG Results</label>
                                <select class="form-control" id="restecg" name="restecg" required>
                                    <option value="">Select</option>
                                    <option value="0">Normal</option>
                                    <option value="1">ST-T Wave Abnormality</option>
                                    <option value="2">Left Ventricular Hypertrophy</option>
                                </select>
                            </div>
                        </div>

                        <!-- Maximum Heart Rate -->
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="thalach">Maximum Heart Rate</label>
                                <input type="number" class="form-control" id="thalach" name="thalach" required>
                            </div>
                        </div>

                        <!-- Exercise Induced Angina -->
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="exang">Exercise Induced Angina</label>
                                <select class="form-control" id="exang" name="exang" required>
                                    <option value="">Select</option>
                                    <option value="1">Yes</option>
                                    <option value="0">No</option>
                                </select>
                            </div>
                        </div>

                        <!-- ST Depression -->
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="oldpeak">ST Depression (Induced by exercise relative to rest)</label>
                                <input type="number" step="0.1" class="form-control" id="oldpeak" name="oldpeak" required>
                            </div>
                        </div>

                        <!-- ST Slope -->
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="slope">ST Slope</label>
                                <select class="form-control" id="slope" name="slope" required>
                                    <option value="">Select</option>
                                    <option value="1">Upsloping</option>
                                    <option value="2">Flat</option>
                                    <option value="3">Downsloping</option>
                                </select>
                            </div>
                        </div>

                        <!-- Number of Major Vessels -->
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="ca">Number of Major Vessels</label>
                                <select class="form-control" id="ca" name="ca" required>
                                    <option value="">Select</option>
                                    <option value="0">0</option>
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                </select>
                            </div>
                        </div>

                        <!-- Thalassemia -->
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="thal">Thalassemia</label>
                                <select class="form-control" id="thal" name="thal" required>
                                    <option value="">Select</option>
                                    <option value="3">Normal</option>
                                    <option value="6">Fixed Defect</option>
                                    <option value="7">Reversible Defect</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-primary" id="predictButton">
                            Predict
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Prediction Result -->
        <div id="predictionResult" class="mt-4" style="display: none;">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Prediction Result</h5>
                    <p id="predictionMessage" class="card-text"></p>
                    <p id="predictionProbability" class="card-text text-muted"></p>
                    <button id="showInterpretation" class="btn btn-info mt-2">Show Interpretation</button>
                </div>
            </div>
        </div>

        <!-- Interpretation Result -->
        <div id="interpretationResult" class="mt-4" style="display: none;">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Model Interpretation</h5>
                    <div id="interpretationImage"></div>
                    <p id="interpretationText" class="mt-3"></p>
                </div>
            </div>
        </div>

        <!-- Error Alert -->
        <div id="errorAlert" class="alert alert-danger mt-4" style="display: none;"></div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
